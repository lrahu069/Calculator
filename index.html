<!DOCTYPE html>
<html>
	<head>
		<title>Calculator</title>
		<link rel="stylesheet" href="Styles/calculator.css">
	</head>
	<body>
		<div class="layout">
		<p class="js-Result display-result"></p>	

		<p><button class="gray-button" onclick="updateCalculation('1');		
		">1</button>

			<button class="gray-button" onclick="updateCalculation('2');			
			">2</button>

			<button class="gray-button" onclick="updateCalculation('3');			
			">3</button>
			
			<button class="orange-button" onclick="updateCalculation(' + ');
			">+</button>
		</p>

		<p><button class="gray-button" onclick="updateCalculation('4');
			">4</button>
		
			<button class="gray-button" onclick="updateCalculation('5');			
			">5</button>
	
			<button class="gray-button" onclick="updateCalculation('6');			
			">6</button>
			
			<button class="orange-button" onclick="updateCalculation(' - ');
			">-</button>
		</p>

		<p><button class="gray-button" onclick="updateCalculation('7');			
		">7</button>
	
			<button class="gray-button" onclick="updateCalculation('8');			
			">8</button>
	
			<button class="gray-button" onclick="updateCalculation('9');			
			">9</button>
			
			<button class="orange-button" onclick="updateCalculation(' * ');
			">*</button>
		</p>

		<p><button class="gray-button" onclick="updateCalculation('0');
		">0</button>

			<button class="gray-button" onclick="updateCalculation('.');
			">.</button>

			<button class="gray-button" onclick="evalResult();
			">=</button>

			<button class="orange-button" onclick="updateCalculation(' / ');
			">/</button>
		</p>

		<p><button class="gray-button" onclick="calculation = '';
				localStorage.removeItem('calcStored');
				display();
			">AC</button>

			<button class="gray-button" onclick="
				calculation = calculation.slice(0, -1);
				display();
			">C</button>
		</p>
		</div>

		<script>
			let calculation = localStorage.getItem('calcStored') || '';

			display();

			function updateCalculation(value){
				calculation += value;
				display();
			}

			function evalResult(){
				calculation = eval(calculation);
				display();
			}

			function display(){
				if(calculation === ''){
					document.querySelector('.js-Result').innerHTML = `&nbsp`;
				}else{
					localStorage.setItem('calcStored', calculation);
					document.querySelector('.js-Result').innerHTML = `${localStorage.getItem('calcStored')}`;
				}
			}
		</script>
	</body>
</html>
